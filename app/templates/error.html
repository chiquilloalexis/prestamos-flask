{% extends "base.html" if current_user.is_authenticated else "base_publica.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block clase_publica %}public--light{% endblock %}
{% block content %}
<div class="public__card card error-box">
  <p class="code">{{ codigo }}</p>
  <h1>{{ titulo }}</h1>
  <p class="muted mt-1">{{ mensaje }}</p>
  <p class="mt-2"><a class="btn btn--primary" href="{{ url_for('inicio') }}">Ir al inicio</a></p>
</div>
{% endblock %}
