{% extends "base_publica.html" %}
{% import "_ui.html" as ui with context %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="public__card">
  <h1>Iniciar sesión</h1>
  <p class="public__lead">Acceso para el administrador y los cobradores.</p>
  <form method="post" data-una-vez>
    {{ ui.csrf() }}
    <div class="field">
      <label for="username">Usuario</label>
      <input class="input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus maxlength="80">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
    </div>
    <button class="btn btn--primary btn--block" type="submit">Entrar</button>
  </form>
</div>
<p class="public__foot">¿Eres cliente? <a href="{{ url_for('portal.entrada') }}" class="btn-link btn-link--plain">Consulta tu cuenta aquí</a></p>
{% endblock %}
